# Refresh Leapfrog Hospital Safety Grades from hospitalsafetygrade.org.
# Leapfrog releases twice per year (Spring/Fall); run manually after each release
# or on this schedule as a fallback.
#
# Prefer a licensed Hopper XLSX when available (place under data/leapfrog-source/).
# Full HTML scrape is slow and rate-limited — keep concurrency low.
name: Update Leapfrog Grades

on:
  schedule:
    # 1st of April and October, 06:00 UTC (~2am Eastern).
    - cron: "0 6 1 4,10 *"
  workflow_dispatch:

jobs:
  update-leapfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Scrape Leapfrog grades
        env:
          # Slow + serial to avoid soft-blocks from hospitalsafetygrade.org.
          LEAPFROG_SCRAPE_DELAY_MS: "900"
          LEAPFROG_SCRAPE_CONCURRENCY: "1"
          LEAPFROG_SCRAPE_MAX_RETRIES: "5"
          LEAPFROG_SCRAPE_ABORT_AFTER_EMPTY: "20"
          LEAPFROG_SCRAPE_MIN_GRADED: "500"
        run: npm run ingest:leapfrog -- --scrape

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          mkdir -p seed
          test -f data/leapfrog-grades.json
          cp data/leapfrog-grades.json seed/leapfrog-grades.json
          # data/* is gitignored except leapfrog-grades.json; seed/ is always tracked.
          git add data/leapfrog-grades.json seed/leapfrog-grades.json
          git diff --staged --quiet || git commit -m "Auto-update: Leapfrog safety grades $(date +'%Y-%m-%d')"
          git push
