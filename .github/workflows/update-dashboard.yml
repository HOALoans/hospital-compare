# Auto-refresh HCA Watchdog dashboard via Anthropic, then send morning digest.
name: Update HCA Dashboard

on:
  schedule:
    # Weekdays ~7am Eastern / 12:00 UTC
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: ./scripts
        run: npm install

      - name: Update dashboard
        working-directory: ./scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node update-dashboard.js

      - name: Check for changes and commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add public/hca/index.html
          git diff --staged --quiet || git commit -m "Auto-update: HCA dashboard $(date +'%Y-%m-%d')"
          git push

      # Morning digest: headlines dated today/yesterday (ET) from current HTML.
      # Skips send when empty or when secrets are missing. See public/hca/README.md:
      #   RESEND_API_KEY, DIGEST_FROM  (+ optional DIGEST_TO)
      - name: Send morning email digest
        working-directory: ./scripts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: node send-morning-digest.js
