# Auto-refresh HCA Watchdog dashboard via Anthropic.
# Installs from repo root (package.json has @anthropic-ai/sdk) so
# `node scripts/update-dashboard.js` resolves the dependency correctly.
name: Update HCA Watchdog dashboard

on:
  schedule:
    # Weekdays 7:00 AM Eastern = 12:00 UTC
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Update dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-dashboard.js

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add public/hca-watchdog/index.html
          if git diff --staged --quiet; then
            echo "No dashboard changes"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "Auto-update: HCA dashboard ${DATE}"
            git push
          fi
